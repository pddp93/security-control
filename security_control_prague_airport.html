<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Security Control · Prague Airport</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef5ff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% -10%,#173c67 0,transparent 42%),radial-gradient(circle at 100% 100%,#102847 0,transparent 35%)}
.app{width:min(720px,100%);margin:auto;padding:18px 14px 40px;position:relative}
.card{background:linear-gradient(145deg,rgba(27,48,73,.9),rgba(11,27,46,.88));border:1px solid rgba(255,255,255,.09);box-shadow:0 18px 45px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.06);border-radius:22px}
.top{padding:18px;margin-bottom:12px}.brand{font-size:13px;letter-spacing:.14em;font-weight:800;color:#9ec7ff}.title{font-size:25px;font-weight:850;margin-top:4px}.sub{color:#8ea4bd;font-size:12px;margin-top:5px}
.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.date{font-weight:800}.nav{padding:9px 12px;border-radius:12px}
button,input,select{font:inherit}button{border:0;color:#fff;cursor:pointer}.btn{background:#193653;border:1px solid rgba(255,255,255,.09);padding:10px 13px;border-radius:12px;font-weight:750}.btn.primary{background:#2d75c7}.btn.danger{background:#6b2630}.btn.small{padding:7px 9px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.stat{padding:15px}.num{font-size:22px;font-weight:900}.label{font-size:11px;color:#8fa5bc;margin-top:3px}
.timeline{padding:15px;margin-bottom:12px}.line{height:9px;border-radius:99px;background:#102338;position:relative;overflow:hidden;margin:12px 0 8px}.tick{font-size:10px;color:#71869d;display:flex;justify-content:space-between}
.person{margin:10px 0;overflow:hidden}.personhead{padding:15px;cursor:pointer}.name{font-weight:850}.meta{font-size:11px;color:#8fa5bc;margin-top:3px}.detail{display:none;padding:0 15px 15px}.person.open .detail{display:block}.block{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px;margin:8px 0;border-radius:14px;background:rgba(5,16,29,.52);border:1px solid rgba(255,255,255,.06)}.blockmain{min-width:0}.time{font-weight:850;font-size:13px}.station{font-size:12px;color:#9fc9ff;margin-top:3px}.actions{display:flex;gap:6px;flex-shrink:0}
.form{margin-top:13px;padding:13px;border-radius:16px;background:rgba(255,255,255,.035)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .full{grid-column:1/-1}label{font-size:10px;color:#8fa5bc;display:block;margin:0 0 4px 2px}input,select{width:100%;background:#0b1c2f;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px}input:disabled{opacity:.55}.hint{font-size:10px;color:#748ba3;margin-top:7px}
.empty{text-align:center;color:#7f96ad;padding:15px}.remove{margin-top:10px}
@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="card top">
    <div class="brand">SECURITY CONTROL</div><div class="title">PRAGUE AIRPORT</div><div class="sub">Obsazení stanovišť</div>
    <div class="row between" style="margin-top:16px"><button class="btn nav" onclick="moveDate(-1)">‹</button><div class="date" id="date"></div><button class="btn nav" onclick="moveDate(1)">›</button></div>
    <button class="btn primary" style="width:100%;margin-top:10px" onclick="printRoster()">Tisk / PDF</button>
  </div>
  <div class="stats">
    <div class="card stat"><div class="num" id="people">0</div><div class="label">Pracovníků</div></div>
    <div class="card stat"><div class="num" id="blocks">0</div><div class="label">Bloků</div></div>
    <div class="card stat"><div class="num" id="stations">0</div><div class="label">Stanovišť</div></div>
  </div>
  <div class="card timeline"><div class="row between"><b>Časová osa</b><span class="sub">06:00 — 06:00</span></div><div class="line" id="timeline"></div><div class="tick"><span>06</span><span>12</span><span>18</span><span>00</span><span>06</span></div></div>
  <div id="peopleList"></div>
</div>
<script>
const stations=["A2","A3-4","A5","A6-9","B1","B2","B3-4","B5","B7-8","B10","COB"];
let date=new Date(); date.setHours(0,0,0,0);
let data=JSON.parse(localStorage.getItem("airport-roster")||"null")||{};
const key=()=>date.toISOString().slice(0,10);
function save(){localStorage.setItem("airport-roster",JSON.stringify(data))}
function addMin(t,m){let [h,x]=t.split(":").map(Number);let d=new Date(2000,0,1,h,x);d.setMinutes(d.getMinutes()+m);return d.toTimeString().slice(0,5)}
function normalize(start,end,type){if(type==="P15")return [start,addMin(start,15)];if(type==="ZP")return [start,addMin(start,30)];return [start,end]}
function ensure(){if(!data[key()])data[key()]=[]}
function moveDate(n){date.setDate(date.getDate()+n);render()}
function render(){
 ensure(); document.getElementById("date").textContent=date.toLocaleDateString("cs-CZ",{weekday:"short",day:"numeric",month:"numeric",year:"numeric"});
 let ps=data[key()]; let all=ps.flatMap(p=>p.blocks||[]);
 document.getElementById("people").textContent=ps.length;document.getElementById("blocks").textContent=all.length;
 document.getElementById("stations").textContent=new Set(all.filter(b=>b.station&&!["ZP","P15"].includes(b.station)).map(b=>b.station)).size;
 document.getElementById("timeline").innerHTML=all.map(b=>{let a=((+b.start.slice(0,2)-6)*60+ +b.start.slice(3));let w=((+b.end.slice(0,2)*60+ +b.end.slice(3))-((+b.start.slice(0,2)*60)+ +b.start.slice(3)));if(w<0)w+=1440;return `<i style="position:absolute;left:${Math.max(0,a/1440*100)}%;width:${w/1440*100}%;height:100%;background:${b.station==="P15"?"#718096":b.station==="ZP"?"#4f718e":"#2d75c7"}"></i>`}).join("");
 const list=document.getElementById("peopleList"); list.innerHTML="";
 ps.forEach((p,i)=>{let el=document.createElement("div");el.className="card person";el.innerHTML=`<div class="personhead" onclick="this.parentNode.classList.toggle('open')"><div class="row between"><div><div class="name">${esc(p.name)}</div><div class="meta">${(p.blocks||[]).length} bloků · směna 12 h</div></div><span>⌄</span></div></div><div class="detail">${(p.blocks||[]).sort((a,b)=>a.start.localeCompare(b.start)).map((b,j)=>`<div class="block"><div class="blockmain"><div class="time">${b.start}–${b.end}</div><div class="station">${esc(b.station)}</div></div><div class="actions"><button class="btn small" onclick="editBlock(${i},${j})">✎</button><button class="btn small danger" onclick="deleteBlock(${i},${j})">Smazat</button></div></div>`).join("")||'<div class="empty">Zatím žádné bloky.</div>'}<div class="form"><div class="grid"><div class="full"><label>Stanoviště / typ</label><select id="st-${i}">${stations.map(s=>`<option>${s}</option>`).join("")}<option value="ZP">ZP · 30 min</option><option value="P15">P15 · 15 min</option></select></div><div><label>Začátek</label><input id="a-${i}" type="time" value="08:00" oninput="syncEnd(${i})"></div><div><label>Konec</label><input id="b-${i}" type="time" value="08:30"></div><div class="full"><button class="btn primary" style="width:100%" onclick="addBlock(${i})">+ Přidat blok</button></div></div><div class="hint">U P15 je délka vždy přesně 15 minut. U ZP vždy 30 minut.</div></div><button class="btn danger remove" style="width:100%" onclick="removePerson(${i})">Odstranit pracovníka</button></div>`;list.appendChild(el)});
 const add=document.createElement("div");add.className="card";add.style.padding="15px";add.innerHTML=`<div class="row"><input id="newName" placeholder="Jméno pracovníka"><button class="btn primary" onclick="addPerson()">+ Přidat</button></div>`;list.appendChild(add);
}
function syncEnd(i){let s=document.getElementById("st-"+i).value;if(s==="P15")document.getElementById("b-"+i).value=addMin(document.getElementById("a-"+i).value,15);if(s==="ZP")document.getElementById("b-"+i).value=addMin(document.getElementById("a-"+i).value,30)}
document.addEventListener("change",e=>{if(e.target.id&&e.target.id.startsWith("st-"))syncEnd(+e.target.id.slice(3))})
function addPerson(){let n=document.getElementById("newName").value.trim();if(!n)return;ensure();data[key()].push({name:n,blocks:[]});save();render()}
function addBlock(i){let s=document.getElementById("st-"+i).value,a=document.getElementById("a-"+i).value,b=document.getElementById("b-"+i).value;[a,b]=normalize(a,b,s);data[key()][i].blocks.push({start:a,end:b,station:s});save();render()}
function editBlock(i,j){let p=data[key()][i],b=p.blocks[j],s=prompt("Stanoviště / typ:",b.station);if(s===null)return;let a=prompt("Začátek HH:MM:",b.start);if(a===null)return;let e=prompt("Konec HH:MM:",b.end);if(e===null)return;if(s==="P15")e=addMin(a,15);if(s==="ZP")e=addMin(a,30);b.station=s;b.start=a;b.end=e;save();render()}
function deleteBlock(i,j){if(!confirm("Smazat tento blok?"))return;data[key()][i].blocks.splice(j,1);save();render()}
function removePerson(i){if(!confirm("Opravdu odstranit pracovníka?"))return;data[key()].splice(i,1);save();render()}
function printRoster(){window.print()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
render();
</script>
</body>
</html>
